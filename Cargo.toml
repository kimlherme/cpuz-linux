[package]
name = "cpuz-linux"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Experimental procedural-noise CPU benchmark for Linux with a terminal UI"
license = "GPL-2.0-only"
repository = "https://github.com/kimlherme/cpuz-linux"
publish = false

[dependencies]
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
codegen-units = 1
